<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luzia</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="luzia.css">
</head>
<body class="fora">
  <section class="acesso" id="acesso" aria-live="polite"></section>

  <aside class="rail">
    <div class="marca" title="Luzia · sua líder técnica">
      <svg viewBox="0 0 64 64" aria-hidden="true"><polygon points="32,3 25,25 3,32 25,39 32,61" style="fill:#b9a2f2;filter:drop-shadow(-2px 0 5px rgba(185,162,242,.75))"/><polygon points="32,3 39,25 61,32 39,39 32,61" style="fill:#f08a3c;filter:drop-shadow(2px 0 6px rgba(240,138,60,.85))"/></svg>
    </div>
    <nav id="nav" aria-label="Telas"></nav>
    <button class="sair" id="sair" type="button">Sair</button>
  </aside>

  <main>
    <div class="conteudo">
      <section id="hoje" class="tela ativa" aria-label="Hoje"></section>
      <section id="trajetoria" class="tela" aria-label="Trajetória"></section>
      <section id="centelhas" class="tela" aria-label="Centelhas"></section>
      <section id="entregas" class="tela" aria-label="Entregas"></section>
      <section id="ajustes" class="tela" aria-label="Ajustes"></section>
    </div>
  </main>
  <nav class="nav-baixo" id="nav-baixo" aria-label="Telas"></nav>

  <div class="gaveta" id="gaveta" hidden>
    <div class="gaveta-fundo" data-fechar></div>
    <article class="gaveta-corpo" id="gaveta-corpo" role="dialog" aria-modal="true" tabindex="-1"></article>
  </div>
  <div class="conquista" id="conquista" role="dialog" aria-modal="true" aria-labelledby="cq-titulo" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="tutorial" id="tutorial" role="dialog" aria-modal="true" aria-labelledby="tt-titulo" hidden></div>

  <script src="luzia.js"></script>
</body>
</html>
